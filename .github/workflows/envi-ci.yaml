name: Detected file changes
on:
  push:
    branches:
      - master
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: "0"
      - name: Get changed files using defaults
        id: changed-files
        uses: tj-actions/changed-files@v14.2
      - name: Run step when a file changes in Images
        if: contains(steps.changed-files.outputs.modified_files, 'images/*')
        run: |
          echo "Changes into Images directory"
        env:
          image_version: ${{ github.event.release.tag_name }}
      - name: Run step when a file changes in Test
        if: contains(steps.changed-files.outputs.modified_files, 'tests/*')
        run: |
          echo "Changes into Tests directory"
        env:
          image_version: ${{ github.event.release.tag_name }}
